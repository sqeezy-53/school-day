name: Сборка Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container: debian:trixie
    steps:
      - name: Установить компоненты
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git python3 make libarchive-tools pkg-config libglib2.0-bin nsis gcc-mingw-w64-ucrt64 g++-mingw-w64-ucrt64 binutils-mingw-w64-ucrt64 build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add x86_64-pc-windows-gnu

      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Проверка репозитория
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --show-toplevel
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          git rev-parse HEAD

      - name: Проверить все ли установлено
        run: |
          rustc --version
          cargo --version
          rustup target list --installed
          command -v x86_64-w64-mingw32ucrt-gcc
          x86_64-w64-mingw32ucrt-gcc --version
          command -v cc
          cc --version
          command -v x86_64-w64-mingw32ucrt-dlltool

      - name: Собрать под винду
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: "-C dlltool=/usr/bin/x86_64-w64-mingw32ucrt-dlltool"
        run: |
          python3 packaging/build-windows.py \
          --work-dir "$RUNNER_TEMP/school-day-build" \
          --output-dir "$RUNNER_TEMP/windows-artifacts" \
          --cross-bin /usr/bin \
          --makensis /usr/bin/makensis \
          --nsis-dir /usr/share/nsis \
          --cross-prefix x86_64-w64-mingw32ucrt-

      - name: Проверить файлы сборки
        run: |
          cd "$RUNNER_TEMP/windows-artifacts"
          sha256sum --check SHA256SUMS-windows
          python3 - <<'PY'
          import json
          import os

          with open("SOURCE-windows.json") as stream:
              source = json.load(stream)
          if source["base_commit"] != os.environ["GITHUB_SHA"] or source["working_tree_dirty"]:
              raise SystemExit("Сборка должна использовать чистый коммит запуска")
          PY
      - name: Сохранить файлы сборки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: school-day-windows
          path: ${{ runner.temp }}/windows-artifacts/
          if-no-files-found: error
