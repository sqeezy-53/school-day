name: Проверки School Day
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf install -y gcc gcc-c++ git rust cargo rustfmt clippy gtk4-devel libadwaita-devel glycin-loaders openssl-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo check --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: 17
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: cargo test --locked -p school-day-core -p school-day-android
      - run: cd android && ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: school-day-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
