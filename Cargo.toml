[package]
name = "school_app_learning"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
chrono = { version = "0.4.45", features = ["serde"] }
gtk = { version = "0.11.5", package = "gtk4" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
gdk-pixbuf = { version = "0.22.0", features = ["v2_40"] }
